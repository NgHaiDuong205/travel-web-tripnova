server.port=8080

spring.jpa.hibernate.ddl-auto=none
#spring.jpa.hibernate.ddl-auto=create
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.profiles.active=uat

# Gửi tham số String dạng "unknown" để Postgres tự ép sang ENUM / inet (status, gender, ip_address...)
spring.datasource.hikari.data-source-properties.stringtype=unspecified

# JWT — ghi đè bằng biến môi trường JWT_SECRET ở môi trường thật (>= 32 byte)
app.jwt.secret=${JWT_SECRET:tripnova-dev-secret-change-me-please-32bytes!}
app.jwt.access-token-ttl-seconds=900
app.jwt.refresh-token-ttl-days=7
app.auth.reset-token-ttl-minutes=30
app.frontend-url=http://localhost:3000
