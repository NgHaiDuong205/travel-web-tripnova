# TripNova — chạy toàn bộ hệ thống bằng 1 lệnh. Hướng dẫn: docker/README.md
#   cp docker/compose.env.example .env      # rồi điền mật khẩu / khoá
#   docker compose up -d --build            # db + backend + ai + frontend + mailpit
#   docker compose --profile routing up -d  # thêm OSRM tự host (lần đầu tải + xử lý bản đồ VN)
#
# Đường dẫn repo FE / AI mặc định nằm cạnh repo này (../fe-tripnova, ../travel_chatbot_python), đổi trong .env.

name: tripnova

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: travel-web-project
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}
      CHATBOT_RO_PASSWORD: ${CHATBOT_RO_PASSWORD:?Đặt CHATBOT_RO_PASSWORD trong .env}
      CHATBOT_RAG_PASSWORD: ${CHATBOT_RAG_PASSWORD:?Đặt CHATBOT_RAG_PASSWORD trong .env}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5433}:5432"   # 5433 để không đụng Postgres cài sẵn trên máy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travel-web-project"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/travel-web-project
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_SHOW_SQL: "false"
      JWT_SECRET: ${JWT_SECRET:?Đặt JWT_SECRET (>= 32 ký tự) trong .env}
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY:?Đặt AI_INTERNAL_KEY trong .env}
      APP_AI_SERVICE_URL: http://ai:8000
      APP_FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      APP_UPLOAD_DIR: /app/uploads
      APP_UPLOAD_PUBLIC_BASE_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8080}
      APP_ROUTING_BASE_URL: ${ROUTING_BASE_URL:-https://router.project-osrm.org}
      APP_ROUTING_MAX_CONCURRENT: ${ROUTING_MAX_CONCURRENT:-3}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # Email: mặc định gửi vào Mailpit (xem tại http://localhost:8025). Production: đổi sang SMTP thật.
      SPRING_MAIL_HOST: ${MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_STARTTLS:-false}
      APP_MAIL_FROM: ${MAIL_FROM:-TripNova <no-reply@tripnova.local>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  ai:
    build:
      context: ${AI_DIR:-../travel_chatbot_python/travel_chatbot}
      # Chỉ chép mã nguồn, KHÔNG chép .env (khoá LLM truyền qua env_file lúc chạy).
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY *.py ./
        RUN useradd --system --uid 10001 tripnova
        USER tripnova
        EXPOSE 8000
        CMD ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ${AI_ENV_FILE:-../travel_chatbot_python/travel_chatbot/.env}
        required: false
    environment:
      # Ghi đè giá trị trong .env của dịch vụ AI để trỏ vào Postgres trong compose.
      DATABASE_URL_RO: postgresql://chatbot_ro:${CHATBOT_RO_PASSWORD}@db:5432/travel-web-project
      DATABASE_URL_RAG: postgresql://chatbot_rag:${CHATBOT_RAG_PASSWORD}@db:5432/travel-web-project
      INTERNAL_KEY: ${AI_INTERNAL_KEY}
      # Chatbot tra còn phòng/chỗ/xe theo ngày qua API công khai của backend.
      SPRING_API_URL: http://backend:8080
    # Không mở cổng ra ngoài: chỉ backend gọi qua mạng nội bộ.

  frontend:
    build:
      context: ${FE_DIR:-../fe-tripnova}
      args:
        REACT_APP_API_BASE_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8080}
      dockerfile_inline: |
        FROM node:24-alpine AS build
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm ci --no-audit --no-fund
        COPY public public
        COPY src src
        COPY scripts scripts
        COPY postcss.config.js tailwind.config.js theme.palette.js ./
        ARG REACT_APP_API_BASE_URL
        ENV REACT_APP_API_BASE_URL=$${REACT_APP_API_BASE_URL} GENERATE_SOURCEMAP=false
        RUN npm run build

        FROM nginx:1.27-alpine
        COPY --from=build /app/build /usr/share/nginx/html
        RUN printf 'server {\n  listen 80;\n  root /usr/share/nginx/html;\n  location /static/ { expires 30d; add_header Cache-Control "public, immutable"; }\n  location / { try_files $$uri /index.html; }\n}\n' > /etc/nginx/conf.d/default.conf
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"   # giao diện xem email
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  # ---- OSRM tự host (profile "routing"); đặt ROUTING_BASE_URL=http://osrm:5000 trong .env để backend dùng ----
  osrm-fetch:
    image: alpine:3.20
    profiles: ["routing"]
    environment:
      OSRM_REGION: ${OSRM_REGION:-asia/vietnam}
    volumes:
      - osrm-data:/data
    command: >
      sh -c 'f=/data/$$(basename $$OSRM_REGION)-latest.osm.pbf;
             [ -f $$f ] || { wget -q -O $$f.part https://download.geofabrik.de/$$OSRM_REGION-latest.osm.pbf && mv $$f.part $$f; }'

  osrm-prepare:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: ["routing"]
    depends_on:
      osrm-fetch:
        condition: service_completed_successfully
    environment:
      OSRM_REGION: ${OSRM_REGION:-asia/vietnam}
    volumes:
      - osrm-data:/data
      - ./docker/osrm/prepare.sh:/prepare.sh:ro
    entrypoint: ["sh", "/prepare.sh"]

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: ["routing"]
    restart: unless-stopped
    depends_on:
      osrm-prepare:
        condition: service_completed_successfully
    volumes:
      - osrm-data:/data
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "200", "/data/vietnam-latest.osrm"]
    ports:
      - "${OSRM_PORT:-5000}:5000"

volumes:
  pgdata:
  uploads:
  osrm-data:
