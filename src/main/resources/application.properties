server.port=8080

spring.jpa.hibernate.ddl-auto=none
#spring.jpa.hibernate.ddl-auto=create
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.profiles.active=uat

# Gửi tham số String dạng "unknown" để Postgres tự ép sang ENUM / inet (status, gender, ip_address...)
spring.datasource.hikari.data-source-properties.stringtype=unspecified

# JWT — ghi đè bằng biến môi trường JWT_SECRET ở môi trường thật (>= 32 byte)
app.jwt.secret=${JWT_SECRET:tripnova-dev-secret-change-me-please-32bytes!}
app.jwt.access-token-ttl-seconds=900
app.jwt.refresh-token-ttl-days=7
app.auth.reset-token-ttl-minutes=30
app.frontend-url=http://localhost:3000

# Đặt phòng / thanh toán
app.booking.hold-minutes=15
app.booking.currency=USD
# Cổng thanh toán giả lập (tắt khi đã tích hợp VNPay/MoMo thật)
app.payment.mock-enabled=true

# Thông tin liên hệ hiển thị ở trang Contact
app.contact.email=support@tripnova.local
app.contact.phone=+84 24 0000 0000
app.contact.address=Ha Noi, Viet Nam
app.contact.working-hours=08:00 - 22:00 (Mon - Sun)

# Email được cấp quyền ADMIN khi khởi động (user phải đăng ký trước). Đặt qua biến môi trường ADMIN_EMAIL.
app.admin.bootstrap-email=${ADMIN_EMAIL:}

# Duong di that (OSRM) cho AI Planner + ban do lich trinh. Mac dinh may chu demo cong khai (chi dung thu);
# production: tu chay OSRM du lieu Viet Nam roi doi base-url (VD http://localhost:5000) + max-concurrent.
# enabled=false -> uoc luong duong chim bay.
app.routing.enabled=true
app.routing.base-url=https://router.project-osrm.org
app.routing.max-concurrent=3

# Migration DB (Flyway): file trong src/main/resources/db/migration (V1 = schema goc).
# DB da co san du lieu ma chua co bang flyway_schema_history -> danh dau o version 1, KHONG chay lai V1, chi chay V2+.
# clean bi tat: Flyway khong bao gio duoc xoa du lieu.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=schema co san
spring.flyway.clean-disabled=true

# Email. Chua dat spring.mail.host (hoac bien moi truong SPRING_MAIL_HOST) -> chi ghi log noi dung email.
# Gmail/SMTP that: SPRING_MAIL_HOST=smtp.gmail.com, SPRING_MAIL_PORT=587, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD (app password),
# SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true, SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
app.mail.from=${MAIL_FROM:TripNova <no-reply@tripnova.local>}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
